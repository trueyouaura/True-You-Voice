name: Verify and deploy Voice Studio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Test pitch detection and state handling
        run: npm test
      - name: Stage static app only
        run: |
          mkdir -p dist
          cp accounts.js cloud.js cloud-config.js index.html styles.css themes.css themes.js app.js pitch.js pitch-worker.js routines.js storage.js favicon.svg .nojekyll dist/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
